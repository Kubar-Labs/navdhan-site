name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-v2
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, audit, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build for Cloudflare
        run: npm run cf:build

  backend-and-database:
    name: PostgreSQL 18, database, and backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: dev
      APPLY_SERVICE_TOKEN: ci-only-apply-service-token-000000000000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres
      DOCUMENT_SCAN_CALLBACK_TOKEN: ci-only-document-scan-token-000000000000
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOOKUP_HMAC_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
      NAVDHAN_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/navdhan_test
      NAVDHAN_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/navdhan_test
      NAVDHAN_TEST_PSQL_PATH: /usr/bin/psql
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dsa_portal/backend/requirements.lock
            dsa_portal/scanner/requirements.lock

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.24"

      - name: Verify backend dependency locks
        working-directory: dsa_portal
        run: |
          uv lock --check --offline
          uv export --frozen --offline --no-dev --no-emit-project \
            --format requirements.txt --output-file backend/requirements.lock
          git diff --exit-code -- uv.lock backend/requirements.lock

      - name: Verify scanner dependency lock
        working-directory: dsa_portal/scanner
        run: |
          uv pip compile requirements.txt --generate-hashes --universal \
            --python-version 3.12 --output-file requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Install hash-locked scanner dependencies
        run: |
          uv venv --python 3.12 /tmp/navdhan-scanner-venv
          uv pip install --python /tmp/navdhan-scanner-venv/bin/python \
            --require-hashes --requirement dsa_portal/scanner/requirements.lock

      - name: Audit scanner dependencies
        run: uvx pip-audit==2.10.1 --requirement dsa_portal/scanner/requirements.lock

      - name: Test private document scanner
        working-directory: dsa_portal/scanner
        run: /tmp/navdhan-scanner-venv/bin/python -m unittest -v test_scanner_app.py

      - name: Install hash-locked backend dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement dsa_portal/backend/requirements.lock

      - name: Audit backend dependencies
        run: uvx pip-audit==2.10.1 --requirement dsa_portal/backend/requirements.lock

      - name: Test database release tooling
        run: python -m unittest discover -s database/tests -v

      - name: Test backend against PostgreSQL 18
        working-directory: dsa_portal/backend
        run: python -m unittest discover -s tests -v
