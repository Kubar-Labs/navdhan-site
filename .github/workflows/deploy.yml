name: Deploy to Cloudflare Workers

# Push to main → build the Next.js site with OpenNext and deploy the
# Cloudflare Worker "kubar-labs-navdhan-site" (Workers Static Assets; serves
# navdhan.app once the custom domain is attached to the Worker).
# The embedded DSA portal ships via the committed public/apply/ (re-sync
# locally with `npm run sync:portal` when it changes).

on:
  push:
    branches: [main, release-v2]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext → .open-next/)
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
