name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact tested main commit SHA
        required: true
        type: string
      staging_database_verified:
        description: Staging database release, RLS, and seed checks passed
        required: true
        type: boolean
      staging_application_verified:
        description: Synthetic staging application persisted and resumed
        required: true
        type: boolean
      staging_scanner_verified:
        description: Clean, infected, unreadable, and replay scanner paths passed
        required: true
        type: boolean
      backend_promoted:
        description: The tested production backend revision is healthy at 100 percent traffic
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify production release attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the exact tested main commit and completed staging gates
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_DATABASE_VERIFIED: ${{ inputs.staging_database_verified }}
          STAGING_APPLICATION_VERIFIED: ${{ inputs.staging_application_verified }}
          STAGING_SCANNER_VERIFIED: ${{ inputs.staging_scanner_verified }}
          BACKEND_PROMOTED: ${{ inputs.backend_promoted }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$STAGING_DATABASE_VERIFIED" = "true"
          test "$STAGING_APPLICATION_VERIFIED" = "true"
          test "$STAGING_SCANNER_VERIFIED" = "true"
          test "$BACKEND_PROMOTED" = "true"

  verify:
    name: Run release gates
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy navdhan.app
    needs: [release-gate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://navdhan.app
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify required Worker runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # shellcheck disable=SC2016
          npx wrangler secret list --format json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const configured = new Set(JSON.parse(input).map((item) => item.name));
              const required = [
                "APPLY_BACKEND_BASE_URL",
                "APPLY_BACKEND_SERVICE_TOKEN",
              ];
              const missing = required.filter((name) => !configured.has(name));
              if (missing.length > 0) {
                console.error(`Missing required Worker secrets: ${missing.join(", ")}`);
                process.exit(1);
              }
            });
          '

      - name: Build (OpenNext → .open-next/)
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: deploy
