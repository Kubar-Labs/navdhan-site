name: Deploy to Cloudflare Pages

# Push to main → build the site and deploy the Cloudflare Worker
# "kubar-labs-navdhan-site" (Workers Static Assets; serves navdhan.app once the
# custom domain is attached to the Worker). Replaces manual `npm run deploy:cf`.
# The embedded DSA portal ships via the committed public/apply/ (re-sync locally
# with `npm run sync:portal` when it changes).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (Cloudflare Workers output → dist/)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
