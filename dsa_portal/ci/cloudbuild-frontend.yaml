# RETIRED — intentional failure guard.
#
# dsa_portal/frontend is the obsolete Perfios/Vite portal. It calls API routes
# that the collection backend does not provide and must never be deployed.
# The supported frontend is the repository-root Next.js application deployed
# to Cloudflare Workers; see CLOUDFLARE-DEPLOY.md.

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: reject-retired-frontend-deploy
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "ERROR: dsa_portal/frontend deployment is retired." >&2
        echo "Deploy the root Next.js Worker using CLOUDFLARE-DEPLOY.md." >&2
        exit 1

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 60s
