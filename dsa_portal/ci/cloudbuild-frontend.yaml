# Cloud Build pipeline for the Kuber Verification frontend (nginx + Vite SPA).
# Triggered on push to master when frontend/** changes.

steps:
  # 1. Build the image (Node build stage compiles Vite, then nginx:alpine serves it)
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag=asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend:$SHORT_SHA
      - --tag=asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend:latest
      - ./frontend

  # 2. Push both tags
  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend]

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - kuber-frontend
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend:$SHORT_SHA
      - --region=asia-south1
      - --set-env-vars=BACKEND_URL=https://kuber-verification-ufzxw24k5a-el.a.run.app
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --timeout=900s
      - --port=8080

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend:$SHORT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/kuber/frontend:latest

timeout: 900s
